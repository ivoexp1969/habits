name: habits
description: Habits — atomic habit tracker with smart reminders.
publish_to: "none"

version: 1.4.7+21

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  android_alarm_manager_plus: ^4.0.4
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^3.0.0
  shared_preferences: ^2.5.3
  timezone: ^0.10.1
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0
  audioplayers: ^6.7.1
  confetti: ^0.8.0
  file_picker: ^8.3.7
  home_widget: ^0.7.0

  # Optional accounts: cloud backup + cross-device sync (app works fully without).
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  installed_apps: ^1.5.2
  in_app_review: ^2.0.9
  share_plus: ^10.1.4
  path_provider: ^2.1.0

# Pin url_launcher_android to the last version that uses androidx.browser 1.8.0 /
# androidx.core 1.13.1. Newer (>=6.3.28) pulls androidx 1.9.0/1.17.0, which demand
# compileSdk 36 + AGP 8.9.1 — the project intentionally stays on compileSdk 35 / AGP 8.7.0.
dependency_overrides:
  url_launcher_android: 6.3.23

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Relaxing background music — Memoraphile "I Do Know" (CC0, no attribution
    # required). Source: opengameart.org/content/i-do-know
    - assets/audio/relax.ogg

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
